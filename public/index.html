<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scrum Poker - Loading</title>
  <style>
    body, html {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      background-color: #f5f5f5;
    }
    .container {
      max-width: 600px;
      padding: 2rem;
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    h1 {
      color: #333;
      margin-bottom: 1rem;
    }
    p {
      color: #666;
      margin-bottom: 2rem;
      line-height: 1.6;
    }
    .loader {
      display: inline-block;
      width: 50px;
      height: 50px;
      border: 5px solid rgba(0, 0, 0, 0.1);
      border-radius: 50%;
      border-top-color: #3498db;
      animation: spin 1s ease-in-out infinite;
      margin-bottom: 1rem;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
  <script>
    // Tracking retry attempts to avoid infinite loop
    let retryCount = 0;
    const maxRetries = 5;
    
    // Check if the API is available
    async function checkApi() {
      try {
        // Increment retry counter
        retryCount++;
        
        // Try both health endpoints
        let response;
        try {
          response = await fetch('/health');
        } catch {
          try {
            response = await fetch('/api/health');
          } catch (e) {
            throw new Error('Both health endpoints failed');
          }
        }
        
        if (response && response.ok) {
          // If successful, redirect to the main app
          window.location.href = window.location.pathname === '/index.html' 
            ? '/' 
            : window.location.pathname;
        } else {
          handleRetry('API not responding properly');
        }
      } catch (error) {
        handleRetry('Error connecting to API');
      }
    }
    
    function handleRetry(message) {
      if (retryCount < maxRetries) {
        document.getElementById('status').textContent = `${message}. Retrying (${retryCount}/${maxRetries})...`;
        setTimeout(checkApi, 3000);
      } else {
        // After max retries, show manual refresh option
        document.getElementById('status').textContent = 'Could not connect to API after multiple attempts.';
        document.getElementById('refresh-button').style.display = 'inline-block';
      }
    }
    
    function manualRefresh() {
      retryCount = 0;
      document.getElementById('refresh-button').style.display = 'none';
      document.getElementById('status').textContent = 'Checking API connection...';
      checkApi();
    }
    
    // Start checking once page is loaded
    window.onload = function() {
      checkApi();
    };
  </script>
</head>
<body>
  <div class="container">
    <h1>Scrum Poker</h1>
    <div class="loader"></div>
    <p id="status">
      Loading the application, please wait...
    </p>
    <p>
      The Scrum Poker application is initializing. This may take a moment on the first load.
    </p>
    <button 
      id="refresh-button" 
      onClick="manualRefresh()" 
      style="display: none; background-color: #3498db; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; margin-top: 20px;">
      Try Again
    </button>
  </div>
</body>
</html>
